version: "3.9"

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: marketintelligence_mssql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/1433 && exec 3<&-' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  market-intelligence:
    build: .
    container_name: marketintelligence_app
    depends_on:
      mssql-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER: mssql-server
      PORT: "1433"
      DATABASE: ${DATABASE:-MarketIntelligenceDWH}
      DB_USERNAME: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      STOCK_PRICE_API_SYMBOL: ${STOCK_PRICE_API_SYMBOL:-IBM}
      STOCK_PRICE_API_INTERVAL: ${STOCK_PRICE_API_INTERVAL:-5min}
      STOCK_PRICE_API_FUNCTION: ${STOCK_PRICE_API_FUNCTION:-TIME_SERIES_DAILY}
    volumes:
      - ./logs:/app/logs
    command: ["bash", "-c", "./wait_for_mssql.sh && python runner.py"]
    restart: "no"

volumes:
  mssql-data:
    name: marketintelligence-mssql-data
