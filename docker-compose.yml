version: "3.9"

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: marketintelligence_mssql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$(echo $$MSSQL_SA_PASSWORD)' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  market-intelligence:
    build: .
    container_name: marketintelligence_app
    depends_on:
      mssql-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MSSQL_SERVER: localhost
      MSSQL_PORT: "1433"
      MSSQL_USERNAME: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./logs:/app/logs
    command: ["bash", "-c", "./wait_for_mssql.sh && python runner.py"]
    restart: "no"
    depends_on:
      mssql-server:
        condition: service_healthy

volumes:
  mssql-data:
    name: marketintelligence-mssql-data
