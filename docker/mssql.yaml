# Docker compose for MSSQL Server - Market Intelligence Project
services:
  mssql-server: 
    env_file:
      - ../.env
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: marketIntelligence_mssql-server
    environment: 
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
    name: marketIntelligence-mssql-data

# To Start
# docker compose -f docker/mssql.yaml up -d

#check it' healthy
#docker ps 
#docker logs marketIntelligence_mssql-server